name: Run PHPUnit on PRs

on:
  pull_request:
    branches: [ main, master ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taxmaster_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v4
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, gd, curl, openssl, pdo_mysql
          ini-values: post_max_size=256M, memory_limit=2G

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Create .env.testing
        run: |
          cp .env.example .env.testing || true
          echo "APP_ENV=testing" >> .env.testing
          echo "APP_KEY=base64:testingkey" >> .env.testing
          echo "DB_CONNECTION=mysql" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=3306" >> .env.testing
          echo "DB_DATABASE=taxmaster_test" >> .env.testing
          echo "DB_USERNAME=root" >> .env.testing
          echo "DB_PASSWORD=root" >> .env.testing

      - name: Wait for MySQL
        run: until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do sleep 1; done

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taxmaster_test
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_ENV: testing
        run: |
          php artisan key:generate --env=testing --force || true
          php artisan migrate --env=testing --force --no-interaction

      - name: Run PHPUnit
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taxmaster_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: ./vendor/bin/phpunit --testsuite=Feature
